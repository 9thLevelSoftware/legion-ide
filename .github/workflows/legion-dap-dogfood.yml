name: Legion DAP Dogfood

# P2.F3.T2: turn the debugger's clean skip into actual proof.
#
# `system_adapter_dogfood` and `system_adapter_launch_step_dogfood` have always
# reported `ok` on every runner — through their soft-skip branch, because no
# lldb-dap/codelldb binary was ever present. A clean skip is not proof. This
# workflow removes the excuse in both directions:
#
#   inventory: what does each runner image ACTUALLY ship, before we touch it?
#              Report-only, never fails, uploads a TOML artifact per OS.
#   dogfood:   install an adapter when the image has none, then run the two
#              dogfood tests with LEGION_DAP_DOGFOOD=1, which the tests already
#              honour to FAIL CLOSED instead of skipping.
#
# The two jobs are separate on purpose. `inventory` answers "the platform ships
# this" and `dogfood` answers "an adapter we may have installed works". Those
# support different claims and an evidence file that merges them is lying by
# omission — hence the `provenance` field in every probe report.
#
# NOTHING HERE WIDENS THE POLICY GATE. The adapter allowlist
# (`AdapterResolutionGrant`) is untouched: where a distro ships a versioned
# `lldb-dap-18`, the install step exposes it under the exact filename the
# resolver already searches for. That is a filename, not a trust decision, and
# a binary that is not an allowlisted adapter still cannot be launched.
#
# This is an INDEPENDENT workflow: its failures do NOT block pull-request merges
# unless the team explicitly adds it to a branch-protection required-check set.
# Same rationale as legion-smoke.yml — it is new, it installs toolchains, and it
# has no proven stable history yet.

on:
  workflow_dispatch:
  # Also run on pull requests that touch the adapter-resolution surface or this
  # workflow itself, so the PR that changes the gate carries its own real-adapter
  # evidence instead of a maintainer having to remember to dispatch it.
  pull_request:
    paths:
      - '.github/workflows/legion-dap-dogfood.yml'
      - 'crates/legion-debug/**'
      - 'xtask/src/dap_adapter_probe.rs'
      # The command is wired up in these two. Without them a follow-up that
      # renames a flag or moves the module ships without the apparatus that
      # proves it — the failure this workflow exists to retire.
      - 'xtask/src/main.rs'
      - 'xtask/src/lib.rs'
  schedule:
    # Weekly on Mondays at 07:00 UTC, an hour after legion-smoke.
    - cron: '0 7 * * 1'

concurrency:
  group: legion-dap-dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Adapter inventory, pre-install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # `xtask` links the whole workspace, so this job needs the same system
      # libraries the standing gates install. Without them the build dies on
      # `libdbus-sys` before the probe ever runs — which is how a job whose
      # own comment says "report-only" went red on its first CI run.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: .github/scripts/install-linux-gui-deps.sh libdbus-1-dev

      - name: Cache Cargo registry and target
        uses: swatinem/rust-cache@v2

      # Report-only in the sense that matters: no `--require`, so finding
      # nothing is recorded rather than failed. It is not immune to going red —
      # a build failure still fails the job, which is exactly what happened on
      # the first run. `--provenance shipped` is truthful only because no
      # adapter install runs before it in this job; the dependency step above
      # installs system libraries, not debuggers. Do not add an adapter here.
      - name: Probe for DAP adapters (report-only)
        run: cargo run -p xtask -- dap-adapter-probe --provenance shipped

      - name: Upload adapter inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dap-adapter-inventory-${{ matrix.os }}
          path: target/dap-adapter/probe_report.toml
          if-no-files-found: warn

  dogfood:
    name: System adapter dogfood, fail-closed (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # `xtask` links the whole workspace, so this job needs the same system
      # libraries the standing gates install. Without them the build dies on
      # `libdbus-sys` before the probe ever runs — which is how a job whose
      # own comment says "report-only" went red on its first CI run.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: .github/scripts/install-linux-gui-deps.sh libdbus-1-dev

      - name: Cache Cargo registry and target
        uses: swatinem/rust-cache@v2

      # Each provisioning step below sets LEGION_DAP_PROVENANCE so the probe
      # report records whether the adapter was already on the image or whether
      # this step put it there.
      - name: Provision an adapter (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$HOME/.legion-dap-bin"
          echo "$HOME/.legion-dap-bin" >> "$GITHUB_PATH"

          if command -v lldb-dap >/dev/null 2>&1; then
            echo "LEGION_DAP_PROVENANCE=shipped" >> "$GITHUB_ENV"
            echo "image already provides lldb-dap at $(command -v lldb-dap)"
            exit 0
          fi

          echo "LEGION_DAP_PROVENANCE=installed" >> "$GITHUB_ENV"
          # Bounded for the same reason as the GUI dependency install: a
          # stalled mirror here would hold the job with nothing to show for it.
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          timeout 300 sudo apt-get "${apt_opts[@]}" update
          # The `lldb` metapackage pulls the distro-default versioned LLVM,
          # which lands lldb-dap (or lldb-vscode on older LLVM) under a
          # VERSIONED name that the resolver does not search for.
          timeout 900 sudo apt-get "${apt_opts[@]}" install -y lldb

          target=""
          for candidate in \
            /usr/lib/llvm-*/bin/lldb-dap \
            /usr/bin/lldb-dap-* \
            /usr/lib/llvm-*/bin/lldb-vscode \
            /usr/bin/lldb-vscode-*
          do
            if [ -x "$candidate" ]; then
              target="$candidate"
              break
            fi
          done

          if [ -z "$target" ]; then
            echo "::error::no lldb-dap/lldb-vscode binary after installing the lldb package"
            echo "--- lldb-like binaries present ---"
            find /usr/bin /usr/lib/llvm-*/bin -maxdepth 1 -name '*lldb*' -print 2>/dev/null
            exit 1
          fi

          # Expose under the exact filename the resolver searches for. This
          # changes a NAME, not the allowlist: `lldb-dap` was already an
          # allowlisted adapter, and nothing else became launchable.
          ln -sf "$target" "$HOME/.legion-dap-bin/lldb-dap"
          echo "exposed $target as \$HOME/.legion-dap-bin/lldb-dap"

      - name: Provision an adapter (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$HOME/.legion-dap-bin"
          echo "$HOME/.legion-dap-bin" >> "$GITHUB_PATH"

          if command -v lldb-dap >/dev/null 2>&1; then
            echo "LEGION_DAP_PROVENANCE=shipped" >> "$GITHUB_ENV"
            echo "image already provides lldb-dap at $(command -v lldb-dap)"
            exit 0
          fi

          # Xcode command line tools ship lldb; recent versions include
          # lldb-dap next to it but not on PATH. Finding it there is still
          # "shipped" — nothing was installed.
          xcrun_path="$(xcrun -f lldb-dap 2>/dev/null)"
          if [ -n "$xcrun_path" ] && [ -x "$xcrun_path" ]; then
            echo "LEGION_DAP_PROVENANCE=shipped" >> "$GITHUB_ENV"
            ln -sf "$xcrun_path" "$HOME/.legion-dap-bin/lldb-dap"
            echo "exposed Xcode-provided $xcrun_path on PATH"
            exit 0
          fi

          echo "LEGION_DAP_PROVENANCE=installed" >> "$GITHUB_ENV"
          brew install llvm
          prefix="$(brew --prefix llvm)"
          if [ -x "$prefix/bin/lldb-dap" ]; then
            ln -sf "$prefix/bin/lldb-dap" "$HOME/.legion-dap-bin/lldb-dap"
            echo "exposed $prefix/bin/lldb-dap on PATH"
            exit 0
          fi

          echo "::error::brew llvm did not provide lldb-dap under $prefix/bin"
          ls -1 "$prefix/bin" 2>/dev/null | grep -i lldb
          exit 1

      # LLDB embeds CPython, and the image's `liblldb.dll` links against
      # `python310.dll` specifically. That library is the one dependent of the
      # whole chain that does not resolve — every other one, including
      # `liblldb.dll` itself, is present. Without it `lldb-dap.exe` dies during
      # loader initialisation before reaching `main`, which is why the process
      # showed as alive with an empty stderr and stdout closed: the framing
      # error `unexpected EOF in headers` was the only symptom of a program
      # that never started.
      #
      # `setup-python` puts the interpreter's directory on PATH, and
      # `python310.dll` lives beside `python.exe`, so this is a PATH fix rather
      # than an LLVM reinstall.
      - name: Provide the Python runtime LLDB links against (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Provision an adapter (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          if command -v lldb-dap >/dev/null 2>&1; then
            echo "LEGION_DAP_PROVENANCE=shipped" >> "$GITHUB_ENV"
            echo "image already provides lldb-dap at $(command -v lldb-dap)"
            exit 0
          fi

          # The windows-latest image ships LLVM under Program Files but does
          # not always put its bin directory on PATH. Finding it there is
          # "shipped" — chocolatey is only the fallback.
          for dir in "/c/Program Files/LLVM/bin" "/c/Program Files (x86)/LLVM/bin"; do
            if [ -x "$dir/lldb-dap.exe" ] || [ -x "$dir/lldb-vscode.exe" ]; then
              echo "LEGION_DAP_PROVENANCE=shipped" >> "$GITHUB_ENV"
              # Windows symlinks need privileges; add the directory instead.
              cygpath -w "$dir" >> "$GITHUB_PATH"
              echo "added $dir to PATH"
              exit 0
            fi
          done

          echo "LEGION_DAP_PROVENANCE=installed" >> "$GITHUB_ENV"
          choco install llvm --yes --no-progress
          if [ -x "/c/Program Files/LLVM/bin/lldb-dap.exe" ]; then
            cygpath -w "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
            echo "added chocolatey LLVM bin to PATH"
            exit 0
          fi

          echo "::error::no lldb-dap.exe after installing LLVM"
          ls -1 "/c/Program Files/LLVM/bin" 2>/dev/null | grep -i lldb
          exit 1

      # `--require` here so a failed provisioning step is reported as exactly
      # that, instead of surfacing later as a confusing dogfood-test panic.
      - name: Probe for DAP adapters (post-provisioning, required)
        run: >
          cargo run -p xtask -- dap-adapter-probe
          --provenance ${{ env.LEGION_DAP_PROVENANCE || 'unknown' }}
          --require
          --out target/dap-adapter/probe_report_dogfood.toml

      - name: Upload post-provisioning probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dap-adapter-dogfood-probe-${{ matrix.os }}
          path: target/dap-adapter/probe_report_dogfood.toml
          if-no-files-found: warn
      # Report-only interrogation of the resolved binary, run before the
      # handshake so its output is present whether or not the handshake
      # passes. Windows reports `unexpected EOF in headers; adapter still
      # running; adapter stderr: <empty>` — a live process that closes stdout
      # without a word — and the leading hypothesis is that this build does not
      # serve DAP over stdio for the way we invoke it. `--version` and `--help`
      # either support that or kill it, which is cheaper than another round of
      # guessing from inside the handshake. See
      # `plans/evidence/production/WS-A-D/phase-2-dap/B19-windows-adapter-diagnosis.md`.
      #
      # `continue-on-error` and `|| true`: this step must never decide the
      # job's colour. A diagnostic that can fail the run it is diagnosing is a
      # second problem, not a tool.
      # Windows only, for a specific reason. `lldb-dap.exe` on the runner image
      # reports `error while loading shared libraries` and exits 127, so it
      # never reaches `main`. The loader prints `?` for the name because MSYS2
      # is relaying a Windows DLL failure through a POSIX-shaped message, which
      # means the shell cannot say which library is missing.
      #
      # `dumpbin /dependents` can. LLDB embeds Python, and a distribution that
      # ships lldb-dap without its matching Python runtime is the most common
      # way this fails — but that is a hypothesis, and this step exists to
      # replace it with a name.
      - name: Name the missing Windows DLL (report-only)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $adapter = Join-Path $env:ProgramFiles 'LLVM\bin\lldb-dap.exe'
          if (-not (Test-Path $adapter)) { Write-Host "no adapter at $adapter"; exit 0 }
          Write-Host "adapter: $adapter"

          $dumpbin = Get-ChildItem -Path (Join-Path $env:ProgramFiles 'Microsoft Visual Studio') `
            -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) {
            $dumpbin = Get-ChildItem -Path (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio') `
              -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $dumpbin) { Write-Host 'dumpbin not found on this image'; exit 0 }

          Write-Host '--- dependents ---'
          $lines = & $dumpbin.FullName /dependents $adapter 2>&1
          $lines | Select-Object -First 40 | ForEach-Object { Write-Host $_ }

          # A dependent that resolves is not the problem; the one that does not
          # is the answer. Windows searches the exe's own directory first, then
          # the system directories, then PATH.
          #
          # The dependent names are parsed from the lines between "Image has the
          # following dependencies:" and the blank line that ends that block.
          # The previous version matched every line against a regex and produced
          # nothing at all, which read like "no dependents" rather than "the
          # parse failed" — a silent diagnostic, which is the failure mode this
          # whole step exists to retire.
          # `liblldb.dll` turned out to sit right beside the adapter, so the
          # absent library is a TRANSITIVE dependency — something liblldb.dll
          # itself needs. LLDB embeds Python, and a distribution shipping
          # liblldb.dll without its matching pythonNNN.dll is the classic way
          # this fails. So both binaries are walked, not just the adapter.
          $adapterDir = Split-Path $adapter
          $searchPath = @($adapterDir, "$env:SystemRoot\System32", $env:SystemRoot) + ($env:PATH -split ';')

          function Get-Dependents($binary) {
            # Every trimmed line that is bare `something.dll` is a dependent
            # name. The block-tracking version reported PARSE FAILED twice, and
            # a diagnostic that cannot parse is worth less than no diagnostic,
            # because it looks like an answer.
            $raw = & $dumpbin.FullName /dependents $binary 2>&1
            ($raw | Out-String) -split "`n" |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -match '^[A-Za-z0-9_.+-]+\.dll$' } |
              Select-Object -Unique
          }

          function Report-Resolvability($binary) {
            Write-Host "--- resolvability of $(Split-Path $binary -Leaf) ---"
            $deps = Get-Dependents $binary
            if (-not $deps -or $deps.Count -eq 0) {
              Write-Host '  PARSE FAILED: no dependent names recovered'
              return
            }
            foreach ($dep in $deps) {
              $hit = $null
              foreach ($dir in $searchPath) {
                if ($dir -and (Test-Path (Join-Path $dir $dep) -ErrorAction SilentlyContinue)) {
                  $hit = Join-Path $dir $dep
                  break
                }
              }
              if ($hit) { Write-Host "  OK      $dep" } else { Write-Host "  MISSING $dep" }
            }
          }

          Report-Resolvability $adapter
          $liblldb = Join-Path $adapterDir 'liblldb.dll'
          if (Test-Path $liblldb) {
            Report-Resolvability $liblldb
          } else {
            Write-Host "--- liblldb.dll is not beside the adapter ---"
          }

          Write-Host '--- python runtimes visible ---'
          Get-ChildItem -Path $adapterDir -Filter 'python*.dll' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  beside adapter: $($_.Name)" }
          Get-Command python -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  python on PATH: $($_.Source)" }

      - name: Interrogate the resolved adapter (report-only)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          # `.exe` first. On the Windows runner `command -v lldb-dap` returns an
          # extensionless path that the shell then cannot execute — the first
          # version of this step reported `exit=127` with empty stdout and
          # stderr, which reads exactly like "the adapter is mute" and is
          # actually "the probe named a file that is not there". The Rust side
          # spawns `lldb-dap.exe` from the same directory and gets a live
          # process, so a probe disagreeing with it is the probe being wrong.
          adapter=""
          for candidate in lldb-dap.exe lldb-dap lldb-vscode.exe lldb-vscode; do
            found="$(command -v "$candidate" 2>/dev/null || true)"
            if [ -n "$found" ] && [ -x "$found" ]; then
              adapter="$found"
              break
            fi
          done
          if [ -z "$adapter" ]; then
            echo "no adapter on PATH; nothing to interrogate"
            exit 0
          fi
          echo "--- resolved: $adapter ---"
          # Prove the probe can execute it at all before trusting anything it
          # reports about the binary's behaviour.
          #
          # The exit code is captured before any test touches it. Written as
          # `if ! cmd && [ "$?" = "127" ]`, `$?` is the negation's own status —
          # 0 or 1, never 127 — so the check could never fire. A detector for
          # "the probe is broken" that is itself broken is worse than none: it
          # reads as evidence that the probe was fine.
          "$adapter" --version >/dev/null 2>&1
          version_rc=$?
          if [ "$version_rc" = "127" ]; then
            echo "PROBE BROKEN: cannot execute $adapter (127); everything below is about the probe, not the adapter"
          fi
          echo "--- --version ---"
          "$adapter" --version 2>&1 | head -20 || true
          echo "--- --help ---"
          "$adapter" --help 2>&1 | head -60 || true
          echo "--- run with no arguments and stdin closed (5s cap) ---"
          # If the binary wants a connection URI rather than stdio, this is
          # where it says so, or exits without a word.
          #
          # Backgrounded with a killer rather than `timeout(1)`: that is GNU
          # coreutils, absent on the macOS runner, and on Windows `timeout` is
          # a different program entirely. A diagnostic that hangs one of three
          # platforms until the 60-minute job cap is worse than no diagnostic.
          "$adapter" >/tmp/adapter-stdout 2>/tmp/adapter-stderr </dev/null &
          adapter_pid=$!
          ( sleep 5; kill -9 "$adapter_pid" 2>/dev/null ) &
          killer_pid=$!
          wait "$adapter_pid"
          echo "exit=$? (137 means it was still running at the cap)"
          kill "$killer_pid" 2>/dev/null
          echo "--- stdout ---"; head -20 /tmp/adapter-stdout || true
          echo "--- stderr ---"; head -20 /tmp/adapter-stderr || true


      # B9 scope: resolve, spawn, initialize, disconnect. LEGION_DAP_DOGFOOD=1
      # is what makes this fail instead of skip. This proves the adapter
      # LAUNCHES and speaks Microsoft DAP; it is not a debug session.
      - name: Dogfood — initialize handshake against the system adapter
        env:
          LEGION_DAP_DOGFOOD: "1"
        run: cargo test -p legion-debug --test system_adapter_dogfood -- --nocapture

      # B13 scope: build a tiny Rust debugee, setBreakpoints, launch with
      # stopOnEntry, one step over, disconnect. This is a debug SESSION against
      # a real adapter. It is still not zero-config Rust debugging in the
      # product UI (roadmap 1.9) — no Legion UI is involved anywhere here.
      # `LEGION_DAP_TRACE_FRAMES=1` echoes every DAP frame in both directions.
      #
      # macOS fails here with "no DAP frame within 15s; adapter still running;
      # adapter stderr: <empty>", and two rounds of diagnosis produced
      # hypotheses that fit that symptom and were wrong. The symptom is the same
      # for a deadlock, a silent refusal, and an adapter that never received the
      # message; what tells them apart is the conversation, and nothing was
      # recording it. This records it.
      - name: Dogfood — launch and step a real Rust debugee
        env:
          LEGION_DAP_DOGFOOD: "1"
          LEGION_DAP_TRACE_FRAMES: "1"
        run: cargo test -p legion-debug --test system_adapter_launch_step_dogfood -- --nocapture

      # Control: the policy gate must still refuse a non-allowlisted binary on a
      # machine that HAS a real adapter installed. This is the case that used to
      # be untestable locally, and the exact scenario that broke this test once
      # before (it asserted "nothing resolves", which silently required that no
      # debugger be present).
      - name: Policy gate still refuses non-allowlisted binaries
        run: cargo test -p legion-debug --test adapter_resolution_policy -- --nocapture
