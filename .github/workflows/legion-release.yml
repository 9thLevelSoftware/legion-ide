name: Legion Release

# Tag-triggered release pipeline: build, test, package, run release-pipeline
# with --from-artifacts, run GP-5 acceptance smoke, and upload release artifacts.
#
# Triggers:
# - Push of tags matching v* (e.g. v0.1.0, v1.0.0-preview.1)
# - Manual workflow_dispatch with channel selection (preview/stable)
#
# Uses --from-artifacts for release pipeline (NOT --mode build).
# Packaging scripts: scripts/package-windows.ps1 (Windows),
#                    scripts/package-preview.sh (Unix).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - stable

concurrency:
  group: legion-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"

jobs:
  # ── Job 1: Build and Test ──────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev \
            libxcursor-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libgl1-mesa-dev libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --all-targets --no-fail-fast

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Job 2: Release ─────────────────────────────────────────────────────────
  release:
    name: Release (${{ matrix.os }})
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev \
            libxcursor-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libgl1-mesa-dev libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: swatinem/rust-cache@v2

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == *"-preview"* ]] || [[ "${{ github.ref }}" == *"-beta"* ]]; then
            echo "channel=preview" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binary
        run: cargo build --release -p legion-desktop

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows.ps1 -Release

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/package-preview.sh
          bash scripts/package-preview.sh --release

      # Hosted signing is intentionally deferred until WS17.T2. Keep this
      # workflow in the repository-safe dry-run mode for now.
      - name: Release pipeline (dry-run)
        run: >
          cargo run -p xtask -- release-pipeline
          --dry-run
          --channel ${{ steps.channel.outputs.channel }}

      - name: Run GP-5 acceptance smoke
        run: cargo run -p xtask -- golden-path-5

      - name: Upload GP-5 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp5-report-${{ matrix.os }}
          path: target/golden-path/gp5_report.toml
          if-no-files-found: error

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legion-release-${{ matrix.os }}
          path: |
            target/release/legion-desktop*
            target/release-pipeline/
            target/preview/*.zip
            target/preview/*.tar.gz
          if-no-files-found: warn
