# Legion desktop release pipeline (supplementary dry-run descriptors + PKT-SIGN signing paths)
#
# These descriptors are planning metadata for `xtask release-pipeline --dry-run`;
# they do not build installers or create GitHub tags/releases. Their version stamp
# is derived from the workspace package version and channel, and is not a GitHub
# release tag. The installed manual-only Legion Native Release
# (`legion-release.yml`) workflow is authoritative for release publication: it computes the next `v0.0.N` tag
# and injects its numeric version into the package scripts. The concrete `0.0.1`
# command values below are placeholders; the workflow substitutes its computed
# version before invoking each script.
#
# channel: "stable"  -> descriptor rollout_policy = "full"
# channel: "preview" -> descriptor rollout_policy = "staged"
#
# Signing modes (PKT-SIGN / ADR-0042):
#   --dry-run         : signer_status = "dry-run/no-production-signer", sha256 = "pending"
#   --from-artifacts  : real sha256 computed; signer resolved from [signing] below
#   (neither)         : rejected with a clear error
#
# Signer resolution:
#   source = "env" / "ci-secret": reads base64 32-byte Ed25519 seed from the
#     named environment variable.  Key material stays in the process environment,
#     NOT in the repository.
#   source = "keyring": looks up the OS keyring by service=reference / user=identity.
#   source = "kms": always "KMS signer not yet implemented — honest unavailable".
#
# If the signer is unavailable, the pipeline records
#   signer_status = "unsigned-beta/no-signer-configured"
# and the release-manifest subcommand omits the .sig file.  This is a first-class
# outcome (not an error) — see M5 WS17-T2 unsigned-beta policy.
#
# NEVER put key material in this file — only reference strings.
package_name = "legion-desktop"
dist_tool = "cargo-packager"

# ---------------------------------------------------------------------------
# Signer reference (ADR-0042 / PKT-SIGN) — reference only, no key material.
# ---------------------------------------------------------------------------
# Key format: base64-encoded 32-byte Ed25519 seed.
# Generate a test key:
#   python3 -c "import secrets,base64; print(base64.b64encode(secrets.token_bytes(32)).decode())"
# Export it:
#   export LEGION_SIGNING_KEY=<base64-output>
#
# For production, store the seed in your CI secret store and reference it here
# by name only.  NEVER commit the decoded bytes, the base64 string, or any
# other form of the private key material.

[signing]
source = "env"
reference = "LEGION_SIGNING_KEY"
identity = "legion-ide release signing"

# ---------------------------------------------------------------------------
# Updater strategy (ADR-0042 custom Zed-style updater)
# ---------------------------------------------------------------------------
[updater]
strategy = "custom-zed-style"
manifest = "release-manifest.v1.toml"
signature = "ed25519-detached"

[[installer_targets]]
name = "legion-desktop-macos-x64-dmg"
platform = "macos"
# Run this descriptor only on a native x86_64 macOS runner.
target = "x86_64-apple-darwin"
artifact = "dmg"
build_command = "bash scripts/package-native.sh --version 0.0.1 --format dmg --out-dir target/release-pipeline/legion-desktop-macos-x64-dmg"
verification_command = "hdiutil verify <artifact> && hdiutil attach -nobrowse -readonly <artifact> && hdiutil detach <mount-point>"

[[installer_targets]]
name = "legion-desktop-macos-arm64-dmg"
platform = "macos"
# Run this descriptor only on a native aarch64 macOS runner.
target = "aarch64-apple-darwin"
artifact = "dmg"
build_command = "bash scripts/package-native.sh --version 0.0.1 --format dmg --out-dir target/release-pipeline/legion-desktop-macos-arm64-dmg"
verification_command = "hdiutil verify <artifact> && hdiutil attach -nobrowse -readonly <artifact> && hdiutil detach <mount-point>"

[[installer_targets]]
name = "legion-desktop-windows-x64-msi"
platform = "windows"
target = "x86_64-pc-windows-msvc"
artifact = "msi"
build_command = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-native.ps1 -Version 0.0.1 -Format wix -OutDir target/release-pipeline/legion-desktop-windows-x64-msi"
verification_command = "msiexec /a <artifact> /qn TARGETDIR=<staging-dir> && recursively locate exactly one legion-desktop.exe below <staging-dir> && <discovered-legion-desktop.exe> --beta-smoke --duration-ms 1500"

[[installer_targets]]
name = "legion-desktop-linux-x64-deb"
platform = "linux"
target = "x86_64-unknown-linux-gnu"
artifact = "deb"
build_command = "bash scripts/package-native.sh --version 0.0.1 --format deb --out-dir target/release-pipeline/legion-desktop-linux-x64-deb"
verification_command = "dpkg-deb --info <artifact> && dpkg-deb -x <artifact> <staging-dir>"

[[installer_targets]]
name = "legion-desktop-linux-x64-appimage"
platform = "linux"
target = "x86_64-unknown-linux-gnu"
artifact = "AppImage"
build_command = "bash scripts/package-native.sh --version 0.0.1 --format appimage --out-dir target/release-pipeline/legion-desktop-linux-x64-appimage"
verification_command = "chmod +x <artifact> && xvfb-run --auto-servernum <artifact> --appimage-extract-and-run --beta-smoke --duration-ms 1500"
