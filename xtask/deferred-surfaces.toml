# Deferred-surface gate (roadmap P9.F3.T4).
#
# The roadmap's rule (P9.F3.T4) is that each deferred surface needs its own ADR,
# policy, tests, and product evidence before its readiness status changes, and
# that the core renderer gate (PR-UI-001) is validated first.
#
# This gate used to be founded on ADR-0046, the surface-expansion freeze, which
# was retired on 2026-08-21. The gate is deliberately unchanged: retiring a
# blanket prohibition on *new* surfaces says nothing about whether these three
# particular ones are ready, and quietly relaxing the check while removing the
# rule would turn one owner decision into three unreviewed promotions.
#
# Without this gate that rule was enforceable only by whoever happened to review
# the diff: the readiness ledger is a markdown table, and a surface could be
# promoted by editing one cell while all four artifacts stayed missing.
#
# A surface may sit deferred with no artifacts at all — that is the honest
# resting state. The obligation attaches the moment the row claims anything
# else.

ledger = "plans/product-readiness-ledger.md"

# The core-renderer precondition, and the condition that actually bites today.
#
# Product activation waits on PR-UI-001 reaching "product workflow validated".
# Every deferred surface already has its own ADR — remote has four — so checking
# artifacts alone would wave through a promotion while the editor underneath is
# still substrate. The artifacts are necessary; the core gate being validated is
# what makes them sufficient.
freeze_gate = "PR-UI-001"
freeze_lifted_status = "Product workflow validated"

# Statuses that count as "still frozen". Matched as a prefix, because the
# ledger's deferred rows carry qualifiers ("Deferred with explicit cut lines").
deferred_statuses = [
  "Deferred",
  "Not started",
  "Blocked",
]

[[surfaces]]
gate = "PR-VSC-002"
reason = """
Isolated extension host. ADR-0046 kept this deferred until it was retired on
2026-08-21; it stays deferred on its own evidence, not on that rule. `legion-vscode-compat` classifies
manifests and contribution points; it does not execute extensions, and no
shipped composition path depends on it.
"""
# Deliberately a file that does not exist: no ADR for the isolated extension
# host has been written, which is precisely why the surface is frozen. The
# number matters though — ADR-0047 is already taken by extension *distribution*,
# a different topic, so naming it here would point whoever writes the real one
# at a colliding number. 0050 is the next free slot.
adr = "plans/adrs/ADR-0050-isolated-extension-host.md"
policy = "crates/legion-security/src/policy.rs"
tests = "crates/legion-vscode-compat/tests"
evidence = "plans/evidence/production/PR-VSC-002"

[[surfaces]]
gate = "PR-ENT-001"
reason = """
Remote development UX. ADR-0046 clause 2 gates product activation of
`legion-remote-transport` on PR-UI-001 promotion, and that crate is the
substrate this surface would activate. Roadmap P9.F3.T2 is the task that would
do it, and it stays blocked while the freeze holds.
"""
adr = "plans/adrs/ADR-0025-production-remote-network-transport.md"
policy = "crates/legion-security/src/policy.rs"
tests = "crates/legion-remote/tests"
evidence = "plans/evidence/remote"

[[surfaces]]
gate = "PR-ENT-002"
reason = """
Collaboration and admin controls. ADR-0046 clause 3 keeps this deferred. The
CRDT/operation-layer ADR exists (P9.F3.T1) but the product surface does not, and
an ADR alone is one of the four artifacts, not all of them.
"""
adr = "plans/adrs/ADR-0045-collaboration-operation-layer.md"
policy = "crates/legion-security/src/policy.rs"
tests = "crates/legion-remote/tests"
evidence = "plans/evidence/production/PR-ENT-002"
