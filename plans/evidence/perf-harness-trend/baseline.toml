# The two search workloads are deliberately UNTRACKED (all metrics 0). Both are
# dominated by the host's per-file-open cost, not by Legion: the same 100K-file
# search measured 74s with a warm page cache and ~950s with a cold one behind
# real-time antivirus, on the same machine, in the same hour. A 60% tolerance
# against either number would cry wolf on every second run, and a gate people
# learn to ignore is worse than no gate. Their absolute ceilings in
# `xtask/src/perf_workloads.rs` are liveness guards, and the archived entries
# keep the numbers visible for humans to read.
[[workload]]
name = "p8.legion_repo"
os = "windows"
profile = "reference"
p50_micros = 0
p95_micros = 0
bytes_value = 0
note = "2026-08-19, Windows 11 x86_64. Untracked: disk-bound. Observed 957ms warm on the reference machine."

