schema_version = 1

# How far above the baseline a measurement may drift before it counts as a
# regression. Wall-clock numbers on a real machine move by tens of percent
# between runs for reasons that have nothing to do with the code; 60% is wide
# enough that a green run means something and narrow enough that a 2x
# regression cannot hide inside it.
tolerance_percent = 60

# Metrics set to 0 are not tracked for that workload: a single-sample workload
# has no meaningful p95, and a latency workload has no byte value.
#
# Rows are keyed by `os` AND `profile`. `profile = "reference"` means a
# developer workstation; `profile = "github-hosted"` means a shared GitHub
# Actions runner, which is several times slower. Grading a hosted run against a
# workstation baseline would produce a gate that fires on the hardware rather
# than on the change, so the two never compare against each other.
#
# Only `windows` / `reference` rows exist today, because that is the only
# combination a real run has been taken on. Every other run archives
# `baseline_status = "missing_for_os"` until someone records theirs from a real
# run's entry — see README.md.

[[workload]]
name = "p8.startup"
os = "windows"
profile = "reference"
p50_micros = 7_333_389
p95_micros = 0
bytes_value = 0
note = "2026-08-19, Windows 11 x86_64 release build. Observed 3.61s with a warm page cache and 7.33s with a cold one on the same machine within an hour; the slower number is used so the gate does not fire on the page cache. Most of it is open_file running the lexical retrieval indexer synchronously on a 1.5MB source file (3.3s warm / 4.7s cold) — a known defect, not a target."

