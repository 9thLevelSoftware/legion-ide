[package]
name = "legion-security"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
legion-protocol = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# P9.F2.T3: signed org policy bundles reuse the ADR-0042 Ed25519 scheme rather
# than inventing a second one. The primitive lives here and `xtask::signing`
# re-exports it, so release manifests and policy bundles verify identically.
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
uuid = { workspace = true }

[features]
# Exposes `synthetic_credentials` to other crates' tests. `#[cfg(test)]`
# items are not visible across crate boundaries, and four crates need it.
test-helpers = []
