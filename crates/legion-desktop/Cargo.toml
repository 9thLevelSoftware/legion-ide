[package]
name = "legion-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["ai"]
ai = [
    "legion-app/ai",
    "legion-app/remote-network",
    "legion-app/updater-http",
    "legion-remote/network",
    "dep:legion-ai",
    "dep:legion-ai-providers",
]
# Manual SKU. legion-app/offline keeps the pure-Rust local predictor and
# excludes legion-ai-providers, updater-http, and legion-remote's network
# feature, so this closure does not link reqwest.
offline = ["legion-app/offline"]

[dependencies]
anyhow = { workspace = true }
legion-ai = { workspace = true, optional = true }
legion-ai-providers = { workspace = true, optional = true }
legion-agent = { workspace = true }
legion-app = { workspace = true, default-features = false }
legion-project = { workspace = true }
legion-protocol = { workspace = true }
legion-remote = { workspace = true, default-features = false }
legion-sandbox = { workspace = true }
legion-storage = { workspace = true }
legion-terminal = { workspace = true }
legion-ui = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zeroize = "1"

[dev-dependencies]
legion-agent = { workspace = true }
legion-debug = { workspace = true }
legion-sandbox = { workspace = true }
legion-ai-providers = { workspace = true }
tempfile = "3"
uuid = { workspace = true }
# Enable `test-helpers` seams on AppComposition (e.g. `set_lsp_health_for_test`)
# so integration tests in tests/ can reach them without a real LSP server.
legion-app = { workspace = true, features = ["test-helpers"] }
egui_kittest = { version = "0.34", features = ["wgpu", "snapshot"] }
