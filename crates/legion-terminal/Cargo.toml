[package]
name = "legion-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
legion-platform = { workspace = true }
legion-protocol = { workspace = true }
legion-security = { workspace = true }
thiserror = { workspace = true }
unicode-width = { workspace = true }
uuid = { workspace = true }

[features]
default = []
windows = ["legion-platform/windows"]

[dev-dependencies]
# Activates the shared synthetic-credential generator for tests.
legion-security = { workspace = true, features = ["test-helpers"] }
serde_json = { workspace = true }
