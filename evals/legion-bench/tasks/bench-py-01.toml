# evals/legion-bench/tasks/bench-py-01.toml — one task per file, loaded by the live-local runner
schema_version = 1
id = "bench-py-01"
kind = "bug_fix"
fixture_repo = "fixtures/bench-py-tool"
holdout = false

prompt = """
TextKit's `top_words` in textkit/stats.py is documented to return the `n` most
frequent tokens as (token, count) pairs, but it currently returns one entry
too few. Two tests in tests/test_stats.py fail because of this. Fix the slice
bug in `top_words` without changing its signature, its tie-breaking order, or
any test, then run `python -m unittest tests.test_stats` from the repository
root to confirm all of the module's tests pass.
"""

[verification]
command = "python -m unittest tests.test_stats"
expected_exit = 0
timeout_secs = 120
expected_files = ["textkit/stats.py", "tests/test_stats.py"]

[scope]
target_kind = "repo"
allowed_tools = ["read", "grep", "glob", "outline", "edit-as-proposal", "terminal-command"]
forbidden_paths = ["tests"]

[gate_budget]
require_tests_pass = true
max_diff_files = 2
max_turns = 8
max_cost_cents = 25

[scoring]
diff_file_penalty = 4
turn_penalty = 3
cost_half_cents_penalty = 1
fail_penalty = 40
